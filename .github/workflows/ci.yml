name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Em PR, um run novo cancela o anterior. Na main cada merge mantém o próprio CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide quais apps rodar olhando os arquivos alterados (paths por job não existe no Actions).
  mudancas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filtro.outputs.api }}
      painel: ${{ steps.filtro.outputs.painel }}
      cliente: ${{ steps.filtro.outputs.cliente }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filtro
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Push inicial ou base inexistente: roda tudo.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            arquivos=$'apps/api/x\napps/painel/x\napps/cliente/x'
          else
            arquivos=$(git diff --name-only --no-renames "$BASE" "$GITHUB_SHA")
          fi
          for app in api painel cliente; do
            # Mudar o workflow ou o compose pode afetar qualquer app, então liga todos.
            if echo "$arquivos" | grep -qE "^(apps/$app/|\.github/workflows/ci\.yml$|docker-compose\.yml$)"; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
            fi
          done

  api:
    needs: mudancas
    if: needs.mudancas.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: barber
          POSTGRES_PASSWORD: barber
          POSTGRES_DB: barber_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U barber -d barber_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.12-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://barber:barber@localhost:5432/barber_db?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: ci-jwt-secret-apenas-para-teste-32-caracteres
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret-apenas-para-teste-32-caracteres
      JWT_REFRESH_EXPIRES_IN: 7d
      INTERNAL_API_KEY: ci-internal-api-key
      MERCADO_PAGO_ACCESS_TOKEN: TEST-ci-mercado-pago
      MERCADO_PAGO_WEBHOOK_SECRET: ci-mp-webhook-secret
      INSTAGRAM_VERIFY_TOKEN: ci-instagram-verify-token
      INSTAGRAM_APP_SECRET: ci-instagram-app-secret
      PAYMENTS_PROVIDER: mock
      EMAIL_PROVIDER: log
      TRUST_PROXY: 'true'
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      PAINEL_PUBLIC_URL: http://localhost:3001
      CLIENTE_PUBLIC_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:check
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      # --forceExit: Redis e BullMQ mantêm handles abertos e o Jest não encerraria sozinho.
      - run: npm run test:e2e -- --runInBand --forceExit

  painel:
    needs: mudancas
    if: needs.mudancas.outputs.painel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/painel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20 # mesma versão do Dockerfile
          cache: npm
          cache-dependency-path: apps/painel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          API_BASE_URL: http://localhost:3000

  cliente:
    needs: mudancas
    if: needs.mudancas.outputs.cliente == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cliente
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20 # mesma versão do Dockerfile
          cache: npm
          cache-dependency-path: apps/cliente/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          API_BASE_URL: http://localhost:3000

  # Check obrigatório único: job pulado por filtro conta como ok, falha ou cancelado reprova.
  ci:
    needs: [mudancas, api, painel, cliente]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          case "$RESULTADOS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
